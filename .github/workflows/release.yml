name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version and download URL in module.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD" '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build module.zip
        run: zip -r module.zip module.json scripts templates styles lang LICENSE README.md

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
