name: Release

# Creates a GitHub release whenever the version in module.json changes on main
# (and no release for that version exists yet). Can also be started by hand.
on:
  push:
    branches: [main]
    paths:
      - module.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version module.json)"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set download URL in module.json
        if: steps.version.outputs.exists == 'false'
        run: |
          DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/module.zip"
          jq --arg d "$DOWNLOAD" '.download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build module.zip
        if: steps.version.outputs.exists == 'false'
        run: zip -r module.zip module.json scripts templates styles lang LICENSE README.md

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
